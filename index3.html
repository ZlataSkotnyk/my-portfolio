<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style3.css">
    <script defer src="script2.js"></script>
</head>

<body>
    <div class="allContent">
        <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Zlata Skotnyk</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">About Me</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index2.html">My Projects</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index3.html">Contact Me</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="welcome">
            <h1>Contact Me Form</h1>
        </div>
        <div class="contactMe">
            <div class="contact">
                <form id="contactForm" onsubmit="return validateForm(event)">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="Name" required>
                        <div class="errorconteiner">
                            <small class="error" id="nameError"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Email" required>
                        <div class="errorconteiner">
                            <small class="error" id="emailError"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" placeholder="Message" required></textarea>
                        <div class="errorconteiner">
                            <small class="error" id="messageError"></small>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                    <p id="submitSuccess" class="success-message"></p>
                </form>
            </div>
        </div>
        <footer>
            <div class="footerText">
                Zlata Skotnyk <br>
                &copy; 2025 copyright reserved
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
